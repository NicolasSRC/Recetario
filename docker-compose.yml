name: recetario

# Configuración común de la API y del worker.
x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    RECETARIO_DATABASE_URL: postgresql+psycopg://recetario:${POSTGRES_PASSWORD:-recetario}@db:5432/recetario
    RECETARIO_JOB_RUNNER: celery
    RECETARIO_REDIS_URL: redis://redis:6379/0
    RECETARIO_TMP_DIR: /app/data/tmp
    RECETARIO_LLM_PROVIDER: ${RECETARIO_LLM_PROVIDER:-openai}
    RECETARIO_LLM_API_KEY: ${RECETARIO_LLM_API_KEY:-}
    RECETARIO_LLM_MODEL: ${RECETARIO_LLM_MODEL:-gpt-4o-mini}
    RECETARIO_LLM_BASE_URL: ${RECETARIO_LLM_BASE_URL:-}
    RECETARIO_SCREEN_TEXT_READER: ${RECETARIO_SCREEN_TEXT_READER:-tesseract}
    RECETARIO_TESSERACT_LANG: ${RECETARIO_TESSERACT_LANG:-spa+eng}
  volumes:
    - ./data:/app/data
    - whisper-cache:/root/.cache/huggingface
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recetario
      POSTGRES_USER: recetario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recetario}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recetario -d recetario"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *backend
    command: ["uvicorn", "app.asgi:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  whisper-cache:
