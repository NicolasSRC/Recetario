[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recetario"
version = "0.1.0"
description = "Recetario con IA: de un TikTok a una receta estructurada y validada"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.40",
    "instructor>=1.3",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
# Transcripción local. Instalar con: pip install -e "backend[audio]"
audio = ["faster-whisper>=1.0"]
# OCR local de frames (F4). Requiere además el binario de Tesseract.
ocr = ["pytesseract>=0.3", "Pillow>=10"]
# F2 en adelante.
api = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fpdf2>=2.7",
    "psycopg[binary]>=3.2",
]
# F5: cola de trabajos con Celery + Redis.
queue = ["celery[redis]>=5.4", "redis>=5.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "pip-audit>=2.7",
]

[project.scripts]
recetario = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "faster_whisper.*", "celery.*", "redis.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
